name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        # fish runs the generated fish integration; minisign the signed-update round trip
        run: brew install bats-core shellcheck fish minisign

      - name: Shellcheck
        # Modules are linted individually and as the built artifact (whole-program view).
        # config/defaults.sh is covered via the artifact.
        run: |
          shellcheck -S warning \
            php-switcher.sh \
            phpswitch/lib/*.sh \
            phpswitch/build.sh \
            phpswitch/phpswitch.sh \
            tools/release.sh \
            tests/helpers/bin/brew \
            tests/helpers/bin/curl \
            tests/helpers/bin/sudo

      - name: Built artifact is up to date
        run: |
          cd phpswitch && ./build.sh > /dev/null
          cd .. && git diff --exit-code -- php-switcher.sh || {
            echo "::error::php-switcher.sh is stale. Run phpswitch/build.sh and commit the result."
            exit 1
          }

      - name: Tests
        run: bats tests/
